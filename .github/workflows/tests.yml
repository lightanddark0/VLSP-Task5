name: Offline Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test without API keys, datasets, or model packages
        run: python -m unittest discover -v
      - name: Check Python syntax
        run: python -m compileall -q spartqa gpt_experiment.py XLNER.py test_gpt_experiment.py test_spartqa.py
      - name: Check API command startup
        run: python gpt_experiment.py --help